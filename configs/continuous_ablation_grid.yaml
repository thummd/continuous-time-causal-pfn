# Re-train config for the 2x2x2 grid_v4 ablation (workshop tab:continuity).
#
# Mirrors the exact hyperparameters recovered from the surviving
# Apr/May-2026 wandb runs of grid_v4.  Use this config (NOT
# continuous_default.yaml) when reproducing the ablation; today's
# default has diverged on n_max, embed_size, total_steps, batch_size,
# weight_scale and num_time_frequencies.
#
# Per-cell axes (encoder x integrator x mechanism) are passed via
# CLI flags to ct_train.py:
#   --positional-only / (omit) for encoder
#   --substeps 1 / --substeps 8 for integrator
#   --mechanism-kind linear / --mechanism-kind neural for mechanism

model:
  n_max: 10
  embed_size: 128
  n_heads: 4
  n_encoder_layers: 4
  n_cross_attn_heads: 4
  context_window: 128
  n_mixer_layers: 1
  num_time_frequencies: 32
  time_min_freq: 0.01
  time_max_freq: 10.0
  tau_levels: [0.1, 0.25, 0.5, 0.75, 0.9]
  head_type: quantile
  n_buckets: 1000

prior:
  mode: tscm
  n_min_prior: 3
  n_max_prior: 10
  edge_prob: 0.3
  hidden_prob: 0.0
  regime_prob: 0.0
  regime_count_range: [2, 3]
  mechanism_kind: linear        # CLI override per cell.
  p_neural: 0.0
  neural_hidden_dim: 8
  neural_out_scale_range: [0.5, 2.0]
  num_substeps: 1               # CLI override per cell.
  p_no_context: 0.0
  tscm_structure: back_door
  schedule: mixed               # Mixed schedule: regular | jittered | exponential picked per trajectory.
  dt: 1.0
  jitter: 0.3
  exp_rate: 1.0
  pair_mode: counterfactual
  t_range: [60, 120]
  intervention_kind_probs: [0.5, 0.3, 0.2]
  intervention_source: prior
  intervention_value_scale: 2.0
  intervention_window_frac: [0.1, 0.3]
  soft_shift_scale: 1.0
  time_varying_profile: random
  theta_range: [0.1, 0.5]       # Stable prior: theta * dt < 1 across schedule.
  sigma_range: [0.2, 0.6]
  weight_scale: 0.3

training:
  batch_size: 24
  lr: 0.0002
  warmup_steps: 200
  total_steps: 10000
  weight_decay: 0.01
  grad_clip: 1.0
  eval_every: 500
  eval_num_steps: 20
  seed: 42
  prefetch: 2
  target_key: Y_true
  n_queries: 1
  query_mode: single
  early_stop_patience: 0
