model:
  n_max: 41
  embed_size: 128
  n_heads: 4
  n_encoder_layers: 4
  n_cross_attn_heads: 4
  n_buckets: 200
  encoder:
    expand_v: 1.0
    use_short_conv: true
    conv_size: 32
    use_gate: true
    use_forget_gate: true
    num_householder: 4
    weaving: true

prior:
  n_min: 3
  n_max: 10
  t_range: [50, 200]
  burn_in: 50
  downstream_prob: 0.7

training:
  batch_size: 8
  lr: 0.0002
  warmup_steps: 50
  total_steps: 500
  grad_clip: 100.0
  weight_decay: 0.01
  bucket_calibration_samples: 500
  eval_every: 100
  seed: 42
  pinball_weight: 0.0
  pinball_quantiles: [0.05, 0.1, 0.2, 0.3, 0.5, 0.7, 0.8, 0.9, 0.95]
